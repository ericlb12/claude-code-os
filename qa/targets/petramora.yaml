name: petramora
default_since: 24h
langfuse:
  enabled: false            # Petramora no tiene Langfuse aún; adapter listo para enchufar
  host_env: LANGFUSE_HOST
  public_key_env: LANGFUSE_PUBLIC_KEY
  secret_key_env: LANGFUSE_SECRET_KEY
  project: ""
supabase:
  enabled: true
  url_env: SUPABASE_URL
  key_env: SUPABASE_KEY
  table: agent_logs
etl:
  table: all_runs            # VIEW que une etl_runs + scraper_runs
  run_at_col: run_at
  status_col: status
freshness:
  tablas:
    - { tabla: scraper_runs, col: run_at, umbral_dias: 2 }
    - { tabla: segmentacion_clientes_raw, col: fecha_corte, umbral_dias: 35 }
    - { tabla: agent_logs, col: timestamp, umbral_dias: 2 }
    - { tabla: azure_freshness, col: max_fecha, umbral_dias: 2 }   # mirror Azure SQL (sincronizado por Cloud Scheduler)
claude_logs_dir: "~/.claude/projects"
cron_log: "qa-reports/petramora/cron.log"
